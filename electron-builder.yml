appId: com.kenigsfels.sylon.os
productName: SYLON Desktop Preview
copyright: Copyright (c) 2026 kenigsfels
asar: true
npmRebuild: false
electronDist: node_modules/electron/dist

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - package.json

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: SYLON-OS-Setup-${version}-${arch}.${ext}

portable:
  artifactName: SYLON-Desktop-Preview-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SYLON OS
  runAfterFinish: true
  deleteAppDataOnUninstall: false
