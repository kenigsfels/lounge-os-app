<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
  <title>SYLON</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Segoe UI",sans-serif;color:#f1f2ed}.shell{position:relative;width:100%;height:100%;display:grid;place-items:center;border:1px solid rgba(179,154,98,.19);border-radius:32px;background:radial-gradient(circle at 50% 35%,rgba(50,83,65,.36),transparent 42%),linear-gradient(145deg,rgba(13,20,16,.98),rgba(5,9,7,.99));box-shadow:0 40px 110px rgba(0,0,0,.65);overflow:hidden}.grid{position:absolute;inset:0;opacity:.055;background-image:linear-gradient(rgba(255,255,255,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.55) 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(circle,#000,transparent 72%)}.core{position:relative;width:138px;height:138px;animation:breathe 2.3s ease-in-out infinite}.ring{position:absolute;inset:12px;border:1px solid rgba(120,181,138,.33);border-radius:50%;animation:spin 7s linear infinite}.ring:nth-child(2){inset:31px;border-color:rgba(197,166,102,.42);transform:rotate(63deg);animation-direction:reverse;animation-duration:5s}.ring::before,.ring::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#83b98b;box-shadow:0 0 16px rgba(117,191,143,.8)}.ring::before{top:12px;left:16px}.ring::after{right:8px;bottom:20px;background:#c7a968;box-shadow:0 0 16px rgba(201,169,99,.7)}.seed{position:absolute;inset:49px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d5c08f,#718f72 42%,#15271d 70%);box-shadow:0 0 28px rgba(112,185,133,.34)}.copy{position:absolute;right:0;bottom:38px;left:0;text-align:center}.copy strong{display:block;font-size:1.05rem;letter-spacing:.28em;text-indent:.28em}.copy span{display:block;margin-top:8px;color:rgba(215,219,211,.38);font-size:.56rem;letter-spacing:.18em;text-transform:uppercase}.signal{position:absolute;bottom:19px;left:50%;display:flex;gap:4px;transform:translateX(-50%)}.signal i{width:3px;height:3px;border-radius:50%;background:#bea366;animation:pulse 1.2s ease-in-out infinite}.signal i:nth-child(2){animation-delay:.2s}.signal i:nth-child(3){animation-delay:.4s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(1.035);filter:brightness(1.1)}}@keyframes pulse{50%{opacity:.2;transform:translateY(-2px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body><main class="shell"><div class="grid"></div><div class="core"><i class="ring"></i><i class="ring"></i><i class="seed"></i></div><div class="copy"><strong>SYLON</strong><span>Desktop Preview</span></div><div class="signal"><i></i><i></i><i></i></div></main></body>
</html>
